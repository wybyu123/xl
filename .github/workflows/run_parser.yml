name: Xunlei Share Parser

on:
  workflow_dispatch: # 支持在 GitHub 界面手动触发点击运行
  schedule:
    - cron: '0 0 * * *' # 可选：每天定时自动运行

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖与 Playwright 浏览器
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: 执行解析脚本
        run: |
          python parse_xunlei.py

      - name: 自动提交生成的 JSON 文件到仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git status --porcelain | grep -q .; then
            git commit -m "auto: update share json [skip ci]"
            git push
          else
            print "没有更改需要提交"
          fi
